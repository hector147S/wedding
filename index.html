<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8f5f0" />
  <title>Invitation</title>
  <meta name="description" content="Notre invitation de mariage" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div id="desktopGate" class="desktop-gate" hidden>
    <div class="desktop-gate__card">
      <p class="desktop-gate__eyebrow">Invitation</p>
      <h1 class="desktop-gate__title">À ouvrir sur votre téléphone</h1>
      <p class="desktop-gate__text">Pour une expérience optimale, veuillez scanner ce QR code avec votre téléphone.</p>
      <img id="desktopGateQr" class="desktop-gate__qr" alt="QR code" />
    </div>
  </div>

  <main id="stage" data-state="poster">

    <section class="layer layer--poster" aria-label="Invitation">
      <img class="poster-img" src="assets/poster.jpg" alt="" fetchpriority="high" />
      <div class="poster-veil" aria-hidden="true"></div>

      <div class="slide" role="button" tabindex="0" aria-label="Glissez pour ouvrir l'invitation">
        <div class="slide__track">
          <span class="slide__label">Glissez pour ouvrir</span>
          <div class="slide__thumb" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <section class="layer layer--video" aria-hidden="true">
      <video id="video" playsinline preload="auto" poster="assets/poster.jpg" muted></video>
    </section>

    <audio id="bgm" preload="auto" loop></audio>

    <section class="layer layer--map" aria-hidden="true">
      <img class="map-bg" src="assets/map-bg.png" alt="" aria-hidden="true" />
      <div class="map-card">
        <div class="map-card__frame">
          <iframe
            id="mapEmbed"
            title="Lieu du mariage"
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
            allowfullscreen></iframe>
        </div>
        <a id="mapButton" class="btn" href="#" target="_blank" rel="noopener">
          Ouvrir dans Google Maps
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M7 17L17 7M9 7h8v8"/>
          </svg>
        </a>
      </div>
    </section>

  </main>

  <script src="script.js?v=2"></script>
</body>
</html>
